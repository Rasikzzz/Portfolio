<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RASIK S — AI/ML ENGINEER</title>
<meta name="description" content="AI/ML engineer building intelligent systems through machine learning, deep learning, computer vision, and physical AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#a3b591;
    --bg-deep:#96a884;
    --bg-panel:#8fa17f;
    --px1:#141d0c;
    --px2:#2c3a20;
    --px3:#55693f;
    --px-ink:#35461f;
    --px4:#82976a;
    --px5:#d3ddc0;
    --font-pixel:'Press Start 2P', monospace;
    --font-body:'VT323', monospace;
    --font-mono:'Space Mono', monospace;
    --maxw:1180px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--px2);
    font-family:var(--font-body); position:relative;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:500;
    background-image:repeating-linear-gradient(rgba(20,29,12,.045) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply;
  }
  ::selection{ background:var(--px2); color:var(--px5); }
  a{ color:inherit; }
  p{ margin:0; }
  h1,h2,h3{ margin:0; font-weight:400; color:var(--px1); }
  .pixel{ font-family:var(--font-pixel); }
  .mono{ font-family:var(--font-mono); }
  .wrap{ max-width:var(--maxw); margin:0 auto; padding:0 32px; }

  a:focus-visible,
  button:focus-visible,
  [role="button"]:focus-visible{
    outline:2px solid var(--px1); outline-offset:3px; border-radius:2px;
  }

  /* ---------- HEADER ---------- */
  header{
    position:sticky; top:0; z-index:200; background:var(--bg);
    border-bottom:1px dashed var(--px3);
  }
  .header-inner{ display:flex; align-items:center; justify-content:space-between; padding:16px 32px; max-width:var(--maxw); margin:0 auto; gap:16px; }
  .logo{ display:flex; align-items:center; gap:10px; cursor:pointer; flex-shrink:0; background:none; border:none; padding:0; }
  .logo-mark{ width:22px; height:22px; display:block; }
  .logo-text{ font-family:var(--font-pixel); font-size:12px; color:var(--px1); letter-spacing:1px; }
  nav.mainnav{ display:flex; gap:2px; flex-wrap:wrap; justify-content:flex-end; }
  nav.mainnav button{
    background:none; border:1px solid transparent; color:var(--px-ink); font-family:var(--font-mono);
    font-size:10px; letter-spacing:1px; padding:8px 10px; cursor:pointer; border-radius:2px;
    white-space:nowrap;
  }
  nav.mainnav button:hover{ color:var(--px1); }
  nav.mainnav button.active{ background:var(--px2); color:var(--px5); }
  .header-status{ display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:9px; color:var(--px-ink); flex-shrink:0; }
  .signal{ display:flex; align-items:flex-end; gap:1.5px; height:9px; }
  .signal i{ width:2.5px; background:var(--px-ink); display:block; }
  .signal i:nth-child(1){height:3px;} .signal i:nth-child(2){height:5px;}
  .signal i:nth-child(3){height:7px;} .signal i:nth-child(4){height:9px;}

  @media (max-width:980px){
    .header-inner{ flex-wrap:wrap; padding:14px 20px; }
    .header-status{ display:none; }
    nav.mainnav{ width:100%; justify-content:flex-start; }
    nav.mainnav button{ font-size:9px; padding:7px 8px; letter-spacing:.5px; }
    .wrap{ padding:0 20px; }
  }

  main{ position:relative; min-height:60vh; transition:opacity .12s steps(2); }
  main.flicker{ opacity:.55; filter:brightness(1.3); }

  /* ---------- HERO ---------- */
  .hero{
    padding:72px 0 56px; border-bottom:1px dashed var(--px3); position:relative; overflow:hidden;
  }
  .hero-grid{ display:grid; grid-template-columns:1.15fr 0.85fr; gap:48px; align-items:center; }
  .eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:3px; color:var(--px-ink);
    text-transform:uppercase; margin-bottom:16px; display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{ content:""; width:22px; height:1px; background:var(--px3); }
  .headline{ font-family:var(--font-pixel); font-size:clamp(26px,4vw,46px); line-height:1.55; color:var(--px1); letter-spacing:1px; }
  .typed-line{ font-family:var(--font-mono); font-size:18px; color:var(--px2); margin-top:16px; min-height:26px; }
  .cursor{ display:inline-block; width:9px; height:17px; background:var(--px1); margin-left:2px; animation:blink 1s steps(2) infinite; vertical-align:-3px; }
  @keyframes blink{ 50%{ opacity:0; } }
  .objective{ font-family:var(--font-body); font-size:20px; line-height:1.55; color:var(--px2); margin-top:22px; max-width:560px; }
  .hero-cta{ display:flex; gap:12px; margin-top:30px; flex-wrap:wrap; }
  .btn{
    font-family:var(--font-mono); font-size:11px; letter-spacing:1.5px; padding:12px 20px;
    border:1px solid var(--px2); background:none; color:var(--px1); cursor:pointer; border-radius:2px;
  }
  .btn:hover{ background:var(--px4); }
  .btn.solid{ background:var(--px2); color:var(--px5); }
  .btn.solid:hover{ background:var(--px1); }
  .hero-art{ display:flex; align-items:center; justify-content:center; }
  .art-frame{
    width:100%; max-width:340px; aspect-ratio:1/1; position:relative;
    border:1px dashed var(--px3); background:var(--bg-deep); overflow:hidden;
  }
  #snakeCanvas{ width:100%; height:100%; display:block; image-rendering:pixelated; }
  .snake-hud{
    position:absolute; top:9px; left:11px; right:11px; z-index:2; pointer-events:none;
    display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:9px;
    letter-spacing:1.5px; color:var(--px1); opacity:.85;
  }

  .stat-strip{ display:flex; border-top:1px dashed var(--px3); margin-top:52px; padding-top:22px; gap:8px; }
  .stat{ flex:1; }
  .stat b{ display:block; font-family:var(--font-pixel); font-size:20px; color:var(--px1); }
  .stat span{ font-family:var(--font-mono); font-size:10px; color:var(--px-ink); letter-spacing:1.5px; }

  @media (max-width:820px){
    .hero{ padding:44px 0 40px; }
    .hero-grid{ grid-template-columns:1fr; gap:32px; }
    .hero-art{ order:-1; }
    .art-frame{ max-width:220px; }
    .stat-strip{ flex-wrap:wrap; }
    .stat{ flex:1 1 45%; margin-bottom:14px; }
  }

  /* ---------- SECTIONS ---------- */
  section.block{ padding:56px 0; border-bottom:1px dashed var(--px3); }
  section.block.last{ border-bottom:none; }
  .block-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:30px; flex-wrap:wrap; gap:14px; }
  .block-title{ font-family:var(--font-pixel); font-size:clamp(18px,2.4vw,26px); color:var(--px1); line-height:1.6; }
  .block-desc{ font-family:var(--font-mono); font-size:12px; color:var(--px-ink); margin-top:6px; max-width:560px; line-height:1.6; }

  .view-toggle{ display:flex; border:1px solid var(--px3); border-radius:3px; overflow:hidden; flex-shrink:0; }
  .view-toggle button{ background:var(--bg-deep); border:none; padding:8px 14px; font-family:var(--font-mono); font-size:10px; color:var(--px-ink); cursor:pointer; letter-spacing:1px; }
  .view-toggle button.active{ background:var(--px2); color:var(--px5); }

  /* ---------- PROJECT CARDS ---------- */
  .proj-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:18px; }
  .proj-card{
    background:var(--bg-deep); border:1px solid var(--px3); border-radius:4px; padding:22px 20px;
    cursor:pointer; transition:background .12s, transform .12s;
    display:flex; flex-direction:column;
  }
  .proj-card:hover{ background:var(--bg-panel); transform:translateY(-2px); }
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .card-icon{ flex-shrink:0; }
  .card-id{ font-family:var(--font-mono); font-size:9px; letter-spacing:2px; color:var(--px-ink); }
  .card-title{ font-family:var(--font-mono); font-size:14px; font-weight:700; color:var(--px1); line-height:1.4; }
  .card-domain{ font-family:var(--font-mono); font-size:9px; color:var(--px-ink); letter-spacing:1px; margin-top:6px; text-transform:uppercase; }
  .card-blurb{ font-family:var(--font-body); font-size:16px; line-height:1.45; color:var(--px2); margin-top:12px; }
  .card-chips{ display:flex; flex-wrap:wrap; gap:4px; margin-top:14px; }
  .tag{ font-family:var(--font-mono); font-size:8px; letter-spacing:.5px; color:var(--px2); border:1px solid var(--px3); padding:3px 6px; border-radius:2px; text-transform:uppercase; }
  .card-foot{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:16px; padding-top:14px; border-top:1px dashed var(--px3); flex-wrap:wrap; }
  .card-open{ font-family:var(--font-mono); font-size:10px; color:var(--px1); letter-spacing:1px; display:flex; align-items:center; gap:6px; }
  .status-badge{
    font-family:var(--font-mono); font-size:8px; letter-spacing:1px; padding:4px 7px; border-radius:2px;
    background:var(--px4); color:var(--px1); white-space:nowrap;
  }
  .status-badge.live{ background:var(--px2); color:var(--px5); }

  .proj-list{ display:flex; flex-direction:column; }
  .proj-row{
    display:flex; align-items:center; gap:16px; padding:16px 6px;
    border-bottom:1px dashed var(--px3); cursor:pointer;
  }
  .proj-row:first-child{ border-top:1px dashed var(--px3); }
  .proj-row:hover{ background:rgba(20,29,12,.05); }
  .row-body{ flex:1; min-width:0; }
  .row-meta{ font-family:var(--font-mono); font-size:9px; letter-spacing:1.5px; color:var(--px-ink); margin-bottom:3px; }
  .row-title{ font-family:var(--font-mono); font-size:14px; font-weight:700; color:var(--px1); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .row-tag{ font-family:var(--font-body); font-size:16px; color:var(--px2); margin-top:3px; }
  .row-arrow{ font-family:var(--font-pixel); font-size:12px; color:var(--px-ink); flex-shrink:0; }

  .hidden{ display:none !important; }

  .menu-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px; }
  .menu-tile{
    background:var(--bg-deep); border:1px solid var(--px3); border-radius:4px; padding:24px 20px; cursor:pointer;
    transition:background .12s, transform .12s;
  }
  .menu-tile:hover{ background:var(--bg-panel); transform:translateY(-2px); }
  .menu-tile .tile-num{ font-family:var(--font-mono); font-size:10px; color:var(--px-ink); letter-spacing:2px; }
  .menu-tile .tile-icon{ margin:14px 0; }
  .menu-tile .tile-title{ font-family:var(--font-pixel); font-size:12px; color:var(--px1); line-height:1.6; }
  .menu-tile .tile-sub{ font-family:var(--font-mono); font-size:11px; color:var(--px-ink); margin-top:8px; display:block; line-height:1.5; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip{ font-family:var(--font-mono); font-size:10px; color:var(--px2); border:1px solid var(--px3); padding:4px 9px; border-radius:10px; }

  .exp-row{ display:flex; align-items:flex-start; gap:16px; padding:20px 0; border-top:1px dashed var(--px3); }
  .exp-icon{ flex-shrink:0; margin-top:2px; }
  .exp-body{ flex:1; }
  .exp-name{ font-family:var(--font-mono); font-size:15px; font-weight:700; color:var(--px1); }
  .exp-role{ font-family:var(--font-body); font-size:17px; color:var(--px2); margin-top:2px; }
  .exp-tag{ font-family:var(--font-mono); font-size:9px; color:var(--px1); background:var(--px4); padding:4px 8px; border-radius:2px; letter-spacing:.5px; flex-shrink:0; }
  .exp-desc{ font-family:var(--font-body); font-size:16px; line-height:1.5; color:var(--px2); margin-top:10px; max-width:640px; }

  .icon-grid{ display:grid; }
  .icon-grid i{ display:block; background:transparent; }
  .icon-grid i.on{ background:var(--px1); }

  /* ---------- FOOTER ---------- */
  footer{ padding:56px 0 40px; }
  .footer-grid{ display:grid; grid-template-columns:1fr 1fr; gap:40px; }
  .contact-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 2px; border-bottom:1px dashed var(--px3); text-decoration:none; }
  .contact-row:first-of-type{ border-top:1px dashed var(--px3); }
  .contact-row:hover .contact-value{ text-decoration:underline; }
  .contact-label{ font-family:var(--font-mono); font-size:10px; color:var(--px-ink); letter-spacing:1.5px; }
  .contact-value{ font-family:var(--font-body); font-size:18px; color:var(--px1); }
  .footer-note{ font-family:var(--font-mono); font-size:10px; color:var(--px-ink); margin-top:24px; letter-spacing:.5px; }
  @media (max-width:820px){ .footer-grid{ grid-template-columns:1fr; gap:8px; } }

  /* ---------- DRAWER ---------- */
  .backdrop{
    position:fixed; inset:0; background:rgba(10,15,7,.45); z-index:300; opacity:0; pointer-events:none;
    transition:opacity .25s ease;
  }
  .backdrop.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; top:0; right:0; bottom:0; width:min(460px,92vw); background:var(--bg-deep);
    border-left:1px solid var(--px2); z-index:301; transform:translateX(100%);
    transition:transform .32s cubic-bezier(.22,.85,.25,1); display:flex; flex-direction:column;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer-header{ display:flex; align-items:center; justify-content:space-between; padding:22px 24px; border-bottom:1px dashed var(--px3); flex-shrink:0; gap:12px; }
  .drawer-close{ font-family:var(--font-mono); font-size:11px; color:var(--px1); background:var(--px4); border:none; padding:8px 12px; border-radius:2px; letter-spacing:1px; cursor:pointer; }
  .drawer-close:hover{ background:var(--px3); color:var(--px5); }
  .drawer-body{ padding:26px 24px 40px; overflow-y:auto; flex:1; }
  .drawer-title{ font-family:var(--font-pixel); font-size:16px; color:var(--px1); line-height:1.7; margin-bottom:14px; }
  .drawer-badges{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .drawer-status{ display:inline-block; font-family:var(--font-mono); font-size:9px; color:var(--px1); background:var(--px4); padding:5px 9px; border-radius:2px; letter-spacing:1px; }
  .drawer-status.live{ background:var(--px2); color:var(--px5); }
  .drawer-domain{ display:inline-block; font-family:var(--font-mono); font-size:9px; color:var(--px2); border:1px solid var(--px3); padding:4px 9px; border-radius:2px; letter-spacing:1px; text-transform:uppercase; }
  .drawer-section{ margin-bottom:20px; }
  .drawer-h{ font-family:var(--font-mono); font-size:9px; letter-spacing:2px; color:var(--px-ink); margin-bottom:6px; text-transform:uppercase; }
  .drawer-p{ font-family:var(--font-body); font-size:17px; line-height:1.5; color:var(--px2); }
  .drawer-links{ display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; margin-bottom:22px; }
  .drawer-link{
    font-family:var(--font-mono); font-size:10px; letter-spacing:1.5px; padding:11px 15px;
    border:1px solid var(--px2); border-radius:2px; text-decoration:none; color:var(--px1);
    background:none; cursor:pointer; display:inline-block;
  }
  .drawer-link.solid{ background:var(--px2); color:var(--px5); }
  .drawer-link:hover{ background:var(--px4); }
  .drawer-link.solid:hover{ background:var(--px1); color:var(--px5); }
  .drawer-none{ font-family:var(--font-mono); font-size:9px; color:var(--px-ink); letter-spacing:1px; margin-bottom:22px; }

  @media (max-width:480px){ .drawer{ width:100vw; } }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    .cursor{ animation:none; }
    .proj-card, .menu-tile, .drawer, .backdrop, main{ transition:none !important; }
    .proj-card:hover, .menu-tile:hover{ transform:none; }
  }
</style>
</head>

<script>
/* ============================================================
   PIXEL ICON BITMAPS (10x10)
   ============================================================ */
const ICONS = {
  chip:[
    "0000000000","0111111110","0100000010","0101101010","0100000010",
    "0101101010","0100000010","0100000010","0111111110","0000000000"
  ],
  grid:[
    "1111111111","1010101010","1111111111","1000000010","1011111010",
    "1010001010","1010001010","1011111010","1000000010","1111111111"
  ],
  nodes:[
    "0010000100","0010000100","0111111110","0100000010","1100000011",
    "0100000010","0111111110","0010000100","0010000100","0000000000"
  ],
  doc:[
    "0111111000","0100001000","0100001000","0111111000","0100000000",
    "0100000000","0100000000","0100000000","0111111000","0000000000"
  ],
  ring:[
    "0001111000","0110000110","1001111001","1011001101","1010101101",
    "1011001101","1001111001","0110000110","0001111000","0000000000"
  ],
  chart:[
    "0000000000","0000000100","0000001110","0000011100","0001111000",
    "0011000010","0110000001","1100000000","1111111111","0000000000"
  ],
  phonecall:[
    "0000110000","0001111000","0011111100","0110110110","0100000010",
    "0110110110","0011111100","0001111000","0000110000","0000000000"
  ],
  boat:[
    "0000000000","0010000100","0010000100","0010000100","0111111110",
    "1111111111","0111111110","0011111100","0001111000","0000000000"
  ],
  climb:[
    "0000000011","0000000011","0000001111","0000001111","0001111111",
    "0001111111","1111111111","1111111111","0000000000","0000000000"
  ],
  rocket:[
    "0000110000","0001111000","0001111000","0001111000","0001111000",
    "0101111010","0111111110","0101111010","0001001000","0010000100"
  ]
};

function iconGrid(key, sizePx){
  sizePx = sizePx || 22;
  const bmp = ICONS[key] || ICONS.chip;
  let cells = "";
  for(const row of bmp){
    for(const ch of row){ cells += '<i class="' + (ch==='1'?'on':'') + '"></i>'; }
  }
  return '<div class="icon-grid" aria-hidden="true" style="width:' + sizePx + 'px;height:' + sizePx +
    'px;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);">' + cells + '</div>';
}

/* ============================================================
   PROJECT DATA
   ------------------------------------------------------------
   Required : id, page, icon, title, domain, tags[], blurb,
              detail, status
   Optional : repo, live
   Optional (rendered only when supplied — never invented):
              objectives[], approach[], results, limitations
   ============================================================ */
const PROJECTS = [

  /* ---------------- INTELLIGENCE ---------------- */
  {
    id:"med-rag", page:"intelligence", icon:"chip",
    title:"Tactical Med LLM",
    domain:"Retrieval-Augmented Generation",

/* ---------- SNAKE HERO ---------- */
function snakeFrame(){
  return '<div class="art-frame">' +
    '<div class="snake-hud mono"><span>SNAKE.EXE</span><span id="snakeScore">000</span></div>' +
    '<canvas id="snakeCanvas" width="240" height="240" role="img" aria-label="Decorative animated snake game"></canvas>' +
    '</div>';
}

let snakeTimer = null;
function stopSnake(){
  if(snakeTimer){ clearInterval(snakeTimer); snakeTimer = null; }
}
function startSnake(){
  stopSnake();
  const canvas = document.getElementById("snakeCanvas");
  const scoreEl = document.getElementById("snakeScore");
  if(!canvas || !canvas.getContext) return;

  const ctx = canvas.getContext("2d");
  const cols = 18, rows = 18;
  const cell = canvas.width / cols;
  const styles = getComputedStyle(document.documentElement);
  const ink = styles.getPropertyValue("--px1").trim() || "#141d0c";
  const dim = styles.getPropertyValue("--px3").trim() || "#55693f";

  let snake, dir, food, score;

  function reset(){
    const cx = Math.floor(cols / 2), cy = Math.floor(rows / 2);
    snake = [ {x:cx-1,y:cy}, {x:cx-2,y:cy}, {x:cx-3,y:cy} ];
    dir = {x:1,y:0};
    score = 0;
    if(scoreEl) scoreEl.textContent = "000";
    placeFood();
  }

  function placeFood(){
    if(snake.length >= cols * rows){ reset(); return; }
    let fx, fy, clash;
    do{
      fx = Math.floor(Math.random() * cols);
      fy = Math.floor(Math.random() * rows);
      clash = snake.some(function(s){ return s.x === fx && s.y === fy; });
    } while(clash);
    food = {x:fx, y:fy};
  }

  function wrap(v, max){ return (v + max) % max; }

  function isFree(x, y){
    return !snake.slice(0, snake.length - 1).some(function(s){
      return s.x === x && s.y === y;
    });
  }

  function chooseDirection(){
    const head = snake[0];
    const options = [
      {x:1,y:0}, {x:-1,y:0}, {x:0,y:1}, {x:0,y:-1}
    ].filter(function(d){
      return !(d.x === -dir.x && d.y === -dir.y);
    });

    let best = null, bestDist = Infinity;
    options.forEach(function(d){
      const nx = wrap(head.x + d.x, cols), ny = wrap(head.y + d.y, rows);
      if(!isFree(nx, ny)) return;
      const dist = Math.abs(nx - food.x) + Math.abs(ny - food.y);
      if(dist < bestDist){ bestDist = dist; best = d; }
    });
    if(best) return best;

    const fallback = options.filter(function(d){
      const nx = wrap(head.x + d.x, cols), ny = wrap(head.y + d.y, rows);
      return isFree(nx, ny);
    });
    if(fallback.length){
      return fallback[Math.floor(Math.random() * fallback.length)];
    }
    return null;
  }

  function step(){
    const next = chooseDirection();
    if(!next){ reset(); return; }
    dir = next;
    const head = snake[0];
    const nx = wrap(head.x + dir.x, cols);
    const ny = wrap(head.y + dir.y, rows);

    if(!isFree(nx, ny)){ reset(); return; }

    snake.unshift({x:nx, y:ny});
    if(nx === food.x && ny === food.y){
      score += 10;
      if(scoreEl) scoreEl.textContent = String(score).padStart(3, "0");
      placeFood();
    } else {
      snake.pop();
    }
  }

  function draw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = dim;
    ctx.globalAlpha = 0.25;
    for(let y = 0; y < rows; y++){
      for(let x = 0; x < cols; x++){
        ctx.fillRect(x*cell + cell/2 - 0.5, y*cell + cell/2 - 0.5, 1, 1);
      }
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = ink;
    ctx.fillRect(food.x*cell + 2, food.y*cell + 2, cell - 4, cell - 4);

    snake.forEach(function(s, i){
      const pad = i === 0 ? 1 : 1.6;
      ctx.fillRect(s.x*cell + pad, s.y*cell + pad, cell - pad*2, cell - pad*2);
    });
  }

  reset();
  draw();
  snakeTimer = setInterval(function(){
    step();
    draw();
  }, 150);
}

/* ---------- DRAWER ---------- */
function drawerSection(heading, body){
  if(!body) return "";
  return '<div class="drawer-section">' +
    '<div class="drawer-h">' + heading + '</div>' +
    '<p class="drawer-p">' + body + '</p>' +

}
function drawerList(heading, arr){
  if(!arr || !arr.length) return "";
  return '<div class="drawer-section">' +
    '<div class="drawer-h">' + heading + '</div>' +
    '<ul class="drawer-p" style="margin:0; padding-left:18px;">' +
      arr.map(function(item){ return '<li>' + item + '</li>'; }).join("") +
    '</ul>' +
  '</div>';
}

function openDrawer(id){
  const p = PROJECTS.filter(function(x){ return x.id === id; })[0];
  if(!p) return;

  lastFocused = document.activeElement;

  const num = projectNumber(p);
  document.getElementById("drawerEyebrow").textContent =
    "PROJECT_" + num + " · " + PAGE_META[p.page].label;

  const chips = p.tags.map(function(t){ return '<span class="chip">' + t + '</span>'; }).join("");

  let documented = "";
  documented += drawerList("Objectives", p.objectives);
  documented += drawerList("Technical Approach", p.approach);
  documented += drawerSection("Results &amp; Evaluation", p.results);
  documented += drawerSection("Limitations &amp; Future Work", p.limitations);

  let links = "";
  if(p.live){
    links += '<a class="drawer-link solid" href="' + p.live + '" target="_blank" rel="noopener">VIEW LIVE →</a>';
  }
  if(p.repo){
    links += '<a class="drawer-link" href="' + p.repo + '" target="_blank" rel="noopener">EXPLORE SYSTEM</a>';
  }
  const linkBlock = links
    ? '<div class="drawer-links">' + links + '</div>'
    : '<div class="drawer-none">REPOSITORY NOT PUBLIC YET</div>';

  document.getElementById("drawerBody").innerHTML =
    '<h3 class="drawer-title pixel" id="drawerTitle">' + p.title + '</h3>' +
    '<div class="drawer-badges">' +
      (p.status ? '<span class="drawer-status' + (p.live ? ' live' : '') + '">' + p.status + '</span>' : '') +
      '<span class="drawer-domain">' + p.domain + '</span>' +
    '</div>' +
    '<div class="drawer-section">' +
      '<div class="drawer-h">Overview</div>' +
      '<p class="drawer-p">' + p.detail + '</p>' +
    '</div>' +
    documented +
    linkBlock +
    '<div class="drawer-h" style="margin-top:22px;">Stack</div>' +
    '<div class="chip-row">' + chips + '</div>';

  const drawer = document.getElementById("drawer");
  drawer.classList.add("open");
  drawer.setAttribute("aria-hidden", "false");
  document.getElementById("backdrop").classList.add("open");
  document.getElementById("drawerClose").focus();
}

function closeDrawer(){
  const drawer = document.getElementById("drawer");
  if(!drawer.classList.contains("open")) return;
  drawer.classList.remove("open");
  drawer.setAttribute("aria-hidden", "true");
  document.getElementById("backdrop").classList.remove("open");
  if(lastFocused && lastFocused.focus) lastFocused.focus();
  lastFocused = null;
}

/* focus trap inside drawer */
document.getElementById("drawer").addEventListener("keydown", function(e){
  if(e.key !== "Tab") return;
  const focusables = this.querySelectorAll('button, a[href], [tabindex]:not([tabindex="-1"])');
  if(!focusables.length) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

/* ---------- NAVIGATION ---------- */
function goTo(page){
  if(page === currentPage) return;
  currentView = "grid";
  const main = document.getElementById("main");
  if(!prefersReducedMotion){
    main.classList.add("flicker");
    setTimeout(function(){
      currentPage = page;
      render();
      main.classList.remove("flicker");
    }, 90);
  } else {
    currentPage = page;
    render();
  }
}

/* ---------- GLOBAL EVENTS ---------- */
document.addEventListener("click", function(e){
  const closeBtn = e.target.closest("[data-close-drawer]");
  if(closeBtn || e.target.id === "backdrop"){ closeDrawer(); return; }

  const pageBtn = e.target.closest("[data-page]");
  if(pageBtn){
    const page = pageBtn.getAttribute("data-page");
    if(page === "home" && currentPage === "home"){
      window.scrollTo({top:0, behavior:"smooth"});
    }
    goTo(page);
    return;
  }

  const scrollBtn = e.target.closest("[data-scroll]");
  if(scrollBtn){
    const el = document.querySelector("footer");
    if(el) el.scrollIntoView({behavior:"smooth"});
    return;
  }

  const projBtn = e.target.closest("[data-project]");
  if(projBtn){ openDrawer(projBtn.getAttribute("data-project")); return; }

  const viewBtn = e.target.closest("[data-view]");
  if(viewBtn){ setView(viewBtn.getAttribute("data-view")); return; }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){ closeDrawer(); return; }

  if(e.key === "Enter" || e.key === " "){
    const target = e.target.closest('[role="button"][data-project], [role="button"][data-page]');
    if(target){
      e.preventDefault();
      if(target.hasAttribute("data-project")){
        openDrawer(target.getAttribute("data-project"));
      } else {
        goTo(target.getAttribute("data-page"));
      }
    }
  }
});

/* ---------- BOOT ---------- */
document.getElementById("logoMark").innerHTML = iconGrid("chip", 22);
document.getElementById("footerSkills").innerHTML =
  SKILLS.map(function(s){ return '<span class="chip">' + s + '</span>'; }).join("");

function tickClock(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  document.getElementById("clock").textContent = hh + ":" + mm;
}
tickClock();
setInterval(tickClock, 15000);

render();
</script>
